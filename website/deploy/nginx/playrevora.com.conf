server {
    listen 80;
    listen [::]:80;
    server_name playrevora.com www.playrevora.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://playrevora.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.playrevora.com;

    ssl_certificate /etc/letsencrypt/live/playrevora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrevora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://playrevora.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name playrevora.com;

    ssl_certificate /etc/letsencrypt/live/playrevora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrevora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location ^~ /health/ {
        return 404;
    }

    location = /patch/v2/test/manifest.json {
        root /srv/revora-download-public;
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }

    location = /patch/v2/stable/manifest.json {
        root /srv/revora-download-public;
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
    }

    location ^~ /patch/v2/ {
        root /srv/revora-download-public;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
