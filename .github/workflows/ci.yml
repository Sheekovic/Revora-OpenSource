name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-endpoint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Managed tests, GUI and CLI builds, synthetic native x86 ABI tests
        shell: pwsh
        run: ./tools/ClientEndpoint/Test.ps1 -ReleaseRuntime
      - name: Validate portable packaging and runtime notices
        id: endpoint-package
        shell: pwsh
        run: ./tools/ClientEndpoint/Build-Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: client-endpoint-windows-x64
          path: |
            ${{ steps.endpoint-package.outputs.zip }}
            ${{ steps.endpoint-package.outputs.checksums }}
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Scan all published history with redaction
        shell: bash
        run: |
          set +e
          gitleaks detect --source . --redact --no-banner --log-opts=--all --exit-code=1 --report-format=json --report-path="$RUNNER_TEMP/revora-secret-review.json"
          scan_status=$?
          if [ -f "$RUNNER_TEMP/revora-secret-review.json" ]; then
            jq '[.[] | {RuleID, File, StartLine, Fingerprint, Commit, Description}]' "$RUNNER_TEMP/revora-secret-review.json"
          fi
          exit "$scan_status"

  static-website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/site-server.test.mjs

  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test real database setup and static website lifecycle
        shell: pwsh
        run: ./scripts/Test-Bootstrap.ps1

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/validate_repository.py

  launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build launcher
        shell: pwsh
        run: ./scripts/Build.ps1 -Component Launcher
      - name: Run launcher tests
        shell: pwsh
        run: ./scripts/Test.ps1 -Component Launcher

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build website
        shell: pwsh
        run: ./scripts/Build.ps1 -Component Website
      - name: Run website tests
        shell: pwsh
        run: ./scripts/Test.ps1 -Component Website

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build 3D server administration application
        shell: pwsh
        run: ./scripts/Build.ps1 -Component Admin
