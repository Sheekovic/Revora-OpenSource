name: Publish static website

on:
  push:
    branches: [main]
    paths: ['website/site/**', 'scripts/serve-site.mjs', 'tests/site-server.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/site-server.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
