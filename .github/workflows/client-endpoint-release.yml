name: Release client endpoint tool

on:
  push:
    tags: ['client-endpoint-v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test released framework and synthetic x86 code
        shell: pwsh
        run: ./tools/ClientEndpoint/Test.ps1 -ReleaseRuntime
      - name: Build portable tool without any client files
        id: package
        shell: pwsh
        run: ./tools/ClientEndpoint/Build-Package.ps1
      - name: Publish tool and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip }}
          PACKAGE_CHECKSUMS: ${{ steps.package.outputs.checksums }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "client-endpoint-v$env:RELEASE_VERSION") { throw 'Tag does not match the built tool VERSION' }
          gh release create $env:GITHUB_REF_NAME $env:PACKAGE_ZIP $env:PACKAGE_CHECKSUMS --verify-tag --title "Revora Client Endpoint $env:RELEASE_VERSION" --notes-file tools/ClientEndpoint/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
