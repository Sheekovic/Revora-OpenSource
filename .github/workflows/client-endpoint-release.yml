name: Release client endpoint tool

on:
  push:
    tags: ['client-endpoint-v1.0.0']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test released framework and synthetic x86 code
        shell: pwsh
        run: ./tools/ClientEndpoint/Test.ps1 -ReleaseRuntime
      - name: Build portable tool without any client files
        id: package
        shell: pwsh
        run: ./tools/ClientEndpoint/Build-Package.ps1
      - name: Publish tool and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip }}
          PACKAGE_CHECKSUMS: ${{ steps.package.outputs.checksums }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:PACKAGE_ZIP $env:PACKAGE_CHECKSUMS --verify-tag --title 'Revora Client Endpoint 1.0.0' --notes-file tools/ClientEndpoint/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
